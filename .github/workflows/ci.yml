name: CI

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run CI on'
        required: true
        default: '(this branch)'
        type: choice
        options:
          - '(this branch)'
          - '(other)'
          - main
          - upstream-main
          - style-prettier-format
      other_branch:
        description: 'Branch name, used only when "(other)" is selected above'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    outputs:
      is_main: ${{ steps.target.outputs.is_main }}
    steps:
      - name: Resolve target branch
        id: target
        env:
          BRANCH: ${{ inputs.branch }}
          OTHER_BRANCH: ${{ inputs.other_branch }}
        run: |
          case "$BRANCH" in
          '' | '(this branch)') ref='' ;;
          '(other)') ref="$OTHER_BRANCH" ;;
          *) ref="$BRANCH" ;;
          esac
          if [ -z "$ref" ] || [ "$ref" = 'main' ]; then
            is_main=true
          else
            is_main=false
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "is_main=$is_main" >> "$GITHUB_OUTPUT"
          echo "Running CI on: ${ref:-$GITHUB_REF_NAME}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.target.outputs.ref }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 25.9.0
      - name: Get npm cache directory
        id: npm-cache-dir
        run: |
          echo "dir=$(npm config get cache)" >> $GITHUB_OUTPUT
      - name: Get hash
        id: hash
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        id: npm-cache
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Install dependencies
        run: npm ci
      - name: Lint / Format
        run: npm run lint
      - name: Check types
        run: npm run tsc
      - name: Test
        run: npm run test
      - name: Build
        run: |
          npm run build
        env:
          VITE_COMMIT: ${{ steps.hash.outputs.sha_short }}
      - name: Check license
        run: npm run checkLicense
      - name: Upload Pages artifact
        if: ${{ github.ref == 'refs/heads/main' && steps.target.outputs.is_main == 'true' }}
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ./dist

  deploy:
    needs: ci
    if: ${{ github.ref == 'refs/heads/main' && needs.ci.outputs.is_main == 'true' }}
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: 'pages'
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
